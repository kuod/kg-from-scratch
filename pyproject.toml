[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-from-scratch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.18,<7",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.35,<2",
    "sentence-transformers>=3.0,<6",
    "pyvis>=0.3,<0.4",
    "pymupdf4llm>=0.0.17,<1",
    "pdfminer.six>=20221105,<2030",
    "scispacy>=0.5,<0.6",
    "anthropic>=0.30,<1",
    "groq>=0.9,<1",
    "tqdm>=4.66,<5",
    "scipy>=1.13,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "black>=24,<27",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
